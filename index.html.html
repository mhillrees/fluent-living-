* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --cab: #3d0a0f; --cream: #f7f3ea; }
html, body { background: var(--cab); width: 100%; height: 100%; overflow: hidden; }

#fl-stage {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--cab); overflow: hidden;
  transition: background 2s ease;
}
#fl-stage.light { background: var(--cream); }

.fl-word {
  position: absolute;
  font-family: 'Jost', sans-serif; font-weight: 200;
  color: var(--cream);
  font-size: clamp(11px, 1.6vw, 15px);
  letter-spacing: 0.18em; text-transform: uppercase;
  opacity: 0; white-space: nowrap; pointer-events: none;
  transition: color 2s ease;
}
#fl-stage.light .fl-word { color: var(--cab); }

#fl-brand {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center; opacity: 0;
  pointer-events: none; width: 92%;
}
.fl-wordmark {
  font-family: 'Gallerya', serif;
  font-size: clamp(44px, 11vw, 116px);
  color: var(--cream); line-height: 1;
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px;
  transition: color 2s ease;
}
#fl-stage.light .fl-wordmark { color: var(--cab); }
.fl-divider {
  width: 0px; height: 0.5px;
  background: var(--cream); opacity: 0.6;
  margin: 0 auto 16px;
  transition: background 2s ease;
}
#fl-stage.light .fl-divider { background: var(--cab); }
.fl-divider.grow { width: 80%; }
.fl-tagline {
  font-family: 'Jost', sans-serif; font-weight: 200;
  font-size: clamp(9px, 1.4vw, 13px);
  color: var(--cream); opacity: 0.6;
  letter-spacing: 0.28em; text-transform: uppercase;
  transition: color 2s ease;
}
#fl-stage.light .fl-tagline { color: var(--cab); }
.fl-logo-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 20px;
}
.fl-logo {
  width: clamp(36px, 5.5vw, 58px);
  height: auto;
  opacity: 0.85;
}
</style>

<script>
(function() {
  var stage = document.getElementById('fl-stage');
  var brand = document.getElementById('fl-brand');

  var phrases = [
    'Flowers ordered?','Reservation made?','Groceries stocked?',
    'Guests arriving?','Table set?','Itinerary finished?',
    'Welcome gift?','House ready?'
  ];

  var wordEls = phrases.map(function(p,i){ return document.getElementById('w'+i); });

  var scatterMobile = [
    {x:10,y:10},{x:44,y:22},{x:48,y:26},{x:12,y:42},
    {x:44,y:52},{x:14,y:62},{x:36,y:74},{x:48,y:80}
  ];
  var scatterDesktop = [
    {x:8, y:10},{x:52,y:7}, {x:62,y:28},{x:5, y:47},
    {x:58,y:56},{x:10,y:68},{x:44,y:76},{x:64,y:70}
  ];

  var fadeDurations = [1.8, 1.4, 0.9, 0.7, 0.5, 0.4, 0.3, 0.25];
  var appearTimes   = [400, 1800, 2700, 3250, 3630, 3910, 4110, 4270];
  var lastAppear    = appearTimes[appearTimes.length - 1];

  function isMobile() { return stage.offsetWidth < 600; }
  function W() { return stage.offsetWidth; }
  function H() { return stage.offsetHeight; }

  function setScatter() {
    var pos = isMobile() ? scatterMobile : scatterDesktop;
    wordEls.forEach(function(el, i) {
      el.style.transition = 'none';
      el.style.left = (pos[i].x / 100 * W()) + 'px';
      el.style.top  = (pos[i].y / 100 * H()) + 'px';
    });
  }

  function getListPositions() {
    var lineHeight = Math.max(24, H() * (isMobile() ? 0.072 : 0.052));
    var totalH = phrases.length * lineHeight;
    var startY = (H() - totalH) / 2;
    return phrases.map(function(p, i) {
      var elW = wordEls[i].offsetWidth;
      return { x: (W() - elW) / 2, y: startY + i * lineHeight };
    });
  }

  setScatter();

  // PHASE 1: cream words on red, accelerating
  wordEls.forEach(function(el, i) {
    setTimeout(function() {
      el.style.transition = 'opacity ' + fadeDurations[i] + 's ease, color 2s ease';
      el.style.opacity = '1';
    }, appearTimes[i]);
  });

  // PHASE 2: travel to list
  var listStart = lastAppear + 600;
  setTimeout(function() {
    var listPos = getListPositions();
    wordEls.forEach(function(el, i) {
      setTimeout(function() {
        el.style.transition = 'left 1s cubic-bezier(0.4,0,0.2,1), top 1s cubic-bezier(0.4,0,0.2,1), color 2s ease';
        el.style.left = listPos[i].x + 'px';
        el.style.top  = listPos[i].y + 'px';
      }, i * 80);
    });
  }, listStart);

  // PHASE 3: fade words out
  var fadeOut = listStart + 1800;
  setTimeout(function() {
    wordEls.forEach(function(el) {
      el.style.transition = 'opacity 1.2s ease';
      el.style.opacity = '0';
    });
  }, fadeOut);

  // PHASE 4: flip to cream + Fluent Living fades in with red letters + logo
  var reveal = fadeOut + 1400;
  setTimeout(function() {
    stage.classList.add('light');
    brand.style.transition = 'opacity 3.5s ease';
    setTimeout(function() { var d = brand.querySelector('.fl-divider'); if(d) { d.style.transition = 'width 3.5s ease, background 2s ease'; d.classList.add('grow'); } }, 200);
    brand.style.opacity = '1';
  }, reveal);

})();
</script>
